<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rousse Aguilar · Marketing & Brand</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--surface:#fff;--ink:#141824;--muted:#5b6475;--line:#dfe3ec;--accent:#d92b4b;--on-accent:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131c;--surface:#181c28;--ink:#f1f3f9;--muted:#a3abbd;--line:#2a3042;--accent:#ff5c78}}
:root[data-theme="dark"]{--bg:#10131c;--surface:#181c28;--ink:#f1f3f9;--muted:#a3abbd;--line:#2a3042;--accent:#ff5c78}
:root[data-theme="dark"],:root:not([data-theme="light"]) .btn{--on-accent:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Arial Black",sans-serif;line-height:1.05;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1000px;margin:0 auto;padding:0 22px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0;gap:12px;flex-wrap:wrap}
.brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px;text-decoration:none}
.ctl{display:flex;gap:8px}
.ctl button{background:var(--surface);color:var(--ink);border:1.5px solid var(--ink);border-radius:30px;padding:5px 14px;font:500 14px "DM Sans",sans-serif;cursor:pointer}
.ctl button b{color:var(--accent)}
.hero{padding:40px 0 30px;display:flex;align-items:center;gap:40px;flex-wrap:wrap-reverse}
.hero>div{flex:1 1 380px}
.photo{width:220px;height:220px;object-fit:cover;border-radius:28px;box-shadow:14px 14px 0 var(--accent);flex:0 0 auto;margin:0 14px 14px 0}
.hero h1{font-size:clamp(46px,10vw,104px);font-weight:800;letter-spacing:-.03em}
.hero h1 span{display:block;color:var(--accent)}
.hero p{max-width:540px;color:var(--muted);font-size:19px;margin:22px 0 28px}
.btn{display:inline-block;background:var(--accent);color:var(--on-accent);padding:13px 24px;border-radius:40px;text-decoration:none;font-weight:500;margin:0 10px 10px 0;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.marquee{overflow:hidden;border-block:1.5px solid var(--ink);padding:14px 0;margin:30px 0 0;background:var(--surface)}
.track{display:flex;width:max-content;gap:40px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;animation:go 40s linear infinite}
.track i{font-style:normal;color:var(--accent)}
@keyframes go{to{transform:translateX(-50%)}}
section{padding:64px 0 8px}
h2{font-size:clamp(32px,5vw,52px);font-weight:800;margin-bottom:28px;letter-spacing:-.02em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px}
.kpi{border-left:4px solid var(--accent);padding:4px 0 4px 16px}
.kpi b{font:800 46px/1 "Bricolage Grotesque",sans-serif;display:block;margin-bottom:6px}
.kpi span{color:var(--muted);font-size:15px;display:block}
.about{max-width:680px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.tags span{background:var(--surface);border:1px solid var(--line);padding:6px 14px;border-radius:30px;font-size:15px}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.tl>li{position:relative;padding:0 0 30px 26px}
.tl>li::before{content:"";position:absolute;left:-7px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.tl h3{font-size:22px}.tl small{color:var(--muted)}
.tl ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
.case{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.case button{all:unset;box-sizing:border-box;width:100%;padding:20px 22px;cursor:pointer;display:flex;justify-content:space-between;gap:14px;align-items:center}
.case button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px;border-radius:14px}
.case h3{font-size:22px}.case small{color:var(--muted);display:block;margin-top:4px;font-family:"DM Sans",sans-serif;font-size:15px}
.plus{font-size:28px;color:var(--accent);transition:transform .25s}
.case[data-open=true] .plus{transform:rotate(45deg)}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}
.case[data-open=true] .body{grid-template-rows:1fr}
.body>div{overflow:hidden}
.body dl{margin:0;padding:0 22px 22px;display:grid;gap:10px}
.body dt{font-weight:500}.body dd{margin:0;color:var(--muted)}
.contact{padding-bottom:80px}
.contact a.big{font:800 clamp(24px,5vw,44px)/1.1 "Bricolage Grotesque",sans-serif;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:6px;word-break:break-word}
.contact p{color:var(--muted);max-width:520px}
.links{margin-top:22px;display:flex;gap:18px;flex-wrap:wrap}
footer{border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){.track{animation:none}html{scroll-behavior:auto}.body,.btn{transition:none}}
</style>
</head>

const $ = id => document.getElementById(id), R = document.documentElement;
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
let lang = "es"; try { const s = localStorage.getItem("lang"); if (s === "en" || s === "es") lang = s; } catch (e) {}
const fmt = (k, v) => (k.pre||"") + v.toFixed(k.d).replace(".", lang === "es" ? "," : ".") + (k.suf||"");
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { run(e.target); io.unobserve(e.target); } }), {threshold: .6});
function run(el) {
  const k = T[lang].kpis[+el.dataset.i];
  if (reduce) { el.textContent = fmt(k, k.n); return; }
  const t0 = performance.now();
  (function s(t) { const p = Math.min((t - t0) / 1400, 1); el.textContent = fmt(k, k.n * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(s); })(t0);
}
function render() {
  const t = T[lang]; R.lang = lang; document.title = t.title;

  ["tagline","b1","b2","mode","hAbout","hExp","hCases","hEdu","hContact","about","langs","cvnote"].forEach(k => $(k).textContent = t[k]);

  document.querySelectorAll(".kpi b").forEach(b => io.observe(b));
  $("tl").innerHTML = t.exp.map(e => "<li><h3>" + e.r + "</h3><small>" + e.c + " · " + e.w + "</small><ul>" + e.p.map(p => "<li>" + p + "</li>").join("") + "</ul></li>").join("");
  $("cases").innerHTML = t.cases.map((c, i) => '<div class="case" data-open="false"><button type="button" aria-expanded="false" aria-controls="c' + i + '"><span><h3>' + c.t + "</h3><small>" + c.m + '</small></span><span class="plus" aria-hidden="true">+</span></button><div class="body" id="c' + i + '"><div><dl><dt>' + t.rl[0] + "</dt><dd>" + c.a + "</dd><dt>" + t.rl[1] + "</dt><dd>" + c.b + "</dd><dt>" + t.rl[2] + "</dt><dd>" + c.c + "</dd></dl></div></div></div>").join("");

  $("edulist").innerHTML = t.edu.map(e => "<p style='margin:0 0 12px'><b>" + e[0] + "</b><br><span style='color:var(--muted)'>" + e[1] + "</span></p>").join("");
  $("mail").textContent = EMAIL; $("mail").href = "mailto:" + EMAIL + "?subject=" + encodeURIComponent(t.subj);
  $("b2").href = "mailto:" + EMAIL + "?subject=" + encodeURIComponent(t.subj);
  $("yr").textContent = new Date().getFullYear();
}
$("lang").addEventListener("click", () => { lang = lang === "es" ? "en" : "es"; try { localStorage.setItem("lang", lang); } catch (e) {} render(); });
$("mode").addEventListener("click", () => { const d = R.dataset.theme ? R.dataset.theme === "dark" : matchMedia("(prefers-color-scheme:dark)").matches; R.dataset.theme = d ? "light" : "dark"; });
